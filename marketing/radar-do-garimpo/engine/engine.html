<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Urbanist;src:url(brand/urbanist.woff2) format('woff2');font-weight:100 900;font-style:normal}
:root{--ink:#0C120F;--gold:#E7B24A;--gold2:#F3D58E;--paper:#F4F1E8;--green:#0F3B2C}
html,body{margin:0;padding:0;background:#0C120F;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--ink);font-family:Urbanist,system-ui,sans-serif;color:var(--paper)}
.scene{position:absolute;inset:0;opacity:0;display:none}
.bg{position:absolute;inset:-10%;background:
  radial-gradient(ellipse 60% 45% at 50% 30%,rgba(231,178,74,.17),transparent 70%),
  radial-gradient(ellipse 70% 50% at 85% 105%,rgba(15,59,44,.85),transparent 70%),
  radial-gradient(ellipse 50% 40% at 0% 80%,rgba(15,59,44,.55),transparent 70%),#0C120F}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(231,178,74,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(231,178,74,.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 75%)}
.media{position:absolute;inset:0;overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.shade{position:absolute;inset:0}
.it{position:absolute;will-change:opacity,transform}
.eyebrow{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.6em}
.eyebrow:before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold)}
.title{font-weight:800;line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
.sub{font-weight:500;line-height:1.25;color:rgba(244,241,232,.82)}
.gold{color:var(--gold)}
.tshadow{text-shadow:0 4px 30px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.5)}
.card{border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 50px 140px rgba(0,0,0,.65),0 0 0 3px rgba(231,178,74,.35),0 0 90px rgba(231,178,74,.12)}
.card.dark{background:#0C120F}
.card .vp{position:relative;overflow:hidden}
.card img{display:block;width:100%;will-change:transform}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{padding:.42em 1em;border-radius:999px;background:rgba(231,178,74,.13);border:2px solid rgba(231,178,74,.55);color:var(--gold2);font-weight:700;white-space:nowrap}
.bullets{display:flex;flex-direction:column;gap:.55em}
.bullet{display:flex;align-items:center;gap:.6em;font-weight:700}
.bullet i{flex:none;width:1.3em;height:1.3em;border-radius:50%;background:var(--gold);color:#0C120F;font-style:normal;font-weight:900;font-size:.8em;display:flex;align-items:center;justify-content:center}
.logoWrap{position:absolute;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(231,178,74,.35)}
.sweep{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,rgba(231,178,74,0) 0deg,rgba(231,178,74,0) 290deg,rgba(231,178,74,.45) 360deg)}
.logo{position:absolute;border-radius:22%;filter:drop-shadow(0 0 60px rgba(231,178,74,.45))}
.word{font-weight:800;letter-spacing:-.02em;text-align:center}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.55em 1.3em;border-radius:999px;background:var(--gold);color:#0C120F;font-weight:800;box-shadow:0 0 60px rgba(231,178,74,.55)}
.price{font-weight:900;letter-spacing:-.03em;color:var(--gold);line-height:1}
#cap{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.01em;line-height:1.1;z-index:50;pointer-events:none}
#cap span.w{display:inline-block;padding:0;margin:0 .13em;color:#fff;-webkit-text-stroke:0;text-shadow:0 0 2px #000,0 4px 0 rgba(0,0,0,.55),0 6px 24px rgba(0,0,0,.75)}
#cap span.on{color:var(--gold);transform:scale(1.08)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(243,213,142,.95),rgba(231,178,74,.0) 60%);opacity:0;z-index:60;pointer-events:none}
</style></head>
<body><div id="stage"><div id="cap"></div><div id="flash"></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);            // easeOutCubic
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let TL=null, S=[], stage=document.getElementById('stage');
const XF=0.28; // crossfade between scenes

function el(tag,cls,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);return e}

function build(tl){
  TL=tl; stage.style.width=tl.W+'px'; stage.style.height=tl.H+'px';
  const cap=document.getElementById('cap'); Object.assign(cap.style,tl.capStyle||{display:'none'});
  tl.scenes.forEach((sc,i)=>{
    const d=el('div','scene'); d.style.zIndex=i+1; stage.appendChild(d);
    const rec={sc,dom:d,items:[]};
    if(sc.bg!=='none'){d.appendChild(el('div','bg'));d.appendChild(el('div','grid'))}
    (sc.items||[]).forEach(it=>{
      let e;
      if(it.kind==='clip'){
        e=el('div','media'); const im=el('img'); im.src=it.dir+'/0001.jpg'; e.appendChild(im);
        if(it.shade) e.appendChild(el('div','shade',null,{background:it.shade}));
        it._img=im; it._last=1;
      } else if(it.kind==='card'){
        e=el('div','it card'+(it.dark?' dark':''),null,it.style);
        const vp=el('div','vp',null,{height:it.vpH+'px'}); const im=el('img'); im.src=it.src; vp.appendChild(im); e.appendChild(vp);
        it._img=im; if(it.srcs){it._imgs=[im]; it.srcs.slice(1).forEach(s=>{const m=el('img',null,null,{position:'absolute',left:0,top:0,opacity:0});m.src=s;vp.appendChild(m);it._imgs.push(m)})}
      } else if(it.kind==='logo'){
        e=el('div','logoWrap it',null,it.style); const S0=it.size;
        it._rings=[1.25,1.7,2.2].map(k=>{const r=el('div','ring',null,{width:S0*k+'px',height:S0*k+'px'});e.appendChild(r);return r});
        it._sweep=el('div','sweep',null,{width:S0*2.2+'px',height:S0*2.2+'px'}); e.appendChild(it._sweep);
        it._logo=el('img','logo',null,{width:S0+'px',height:S0+'px'}); it._logo.src='brand/logo-512.png'; e.appendChild(it._logo);
      } else {
        e=el('div','it '+(it.cls||''),it.html,it.style);
      }
      d.appendChild(e); it._el=e; rec.items.push(it);
    });
    S.push(rec);
  });
}

function itemAnim(it,lt,dur){
  const tin=it.tin||0, tout=(it.tout!=null?it.tout:dur+1);
  const a=eo(ramp(lt,tin,tin+(it.din||0.5)));
  const b=1-ramp(lt,tout-0.3,tout);
  const e=it._el; let tr='';
  const an=it.anim||'up';
  if(an==='up') tr=`translateY(${(1-a)*(it.dist||60)}px)`;
  else if(an==='left') tr=`translateX(${(1-a)*-(it.dist||80)}px)`;
  else if(an==='right') tr=`translateX(${(1-a)*(it.dist||80)}px)`;
  else if(an==='pop') tr=`scale(${0.7+0.3*eback(ramp(lt,tin,tin+0.55))})`;
  else if(an==='card') tr=`translateY(${(1-a)*140}px) scale(${0.92+0.08*a})`;
  if(it.kb){const p=ramp(lt,0,dur); tr+=` scale(${it.kb[0]+(it.kb[1]-it.kb[0])*p})`;}
  if(it.pulse){const p=Math.max(0,lt-tin-0.6); tr+=` scale(${1+0.035*Math.sin(p*5.5)})`;}
  e.style.opacity=(a*b).toFixed(3);
  if(an!=='none'||it.kb||it.pulse) e.style.transform=tr;
}

async function seek(t){
  const waits=[];
  for(const r of S){
    const sc=r.sc, lt=t-sc.start, dur=sc.dur;
    const vis = lt>=-0.001 && lt < dur+XF+0.02;
    if(!vis){ if(r.dom.style.display!=='none'){r.dom.style.display='none'} continue; }
    r.dom.style.display='block';
    const fin = sc.first?1:eio(ramp(lt,0,XF));
    r.dom.style.opacity=fin.toFixed(3);
    for(const it of r.items){
      if(it.kind==='clip'){
        const speed=it.speed||1; let f=Math.floor((lt*speed+ (it.offset||0))*30)+1; f=Math.max(1,Math.min(it.n,f));
        if(f!==it._last){it._img.src=it.dir+'/'+String(f).padStart(4,'0')+'.jpg'; it._last=f; waits.push(it._img.decode().catch(()=>{}))}
        const z=(it.kb||[1.0,1.08]); const p=ramp(lt,0,dur+XF);
        it._img.style.transform=`scale(${z[0]+(z[1]-z[0])*p})`;
      } else if(it.kind==='card'){
        itemAnim(it,lt,dur);
        if(it.pan){ const ih=it.imgH, vh=it.vpH; const p=eio(ramp(lt,it.pan[0],it.pan[1])); it._img.style.transform=`translateY(${-(ih-vh)*p}px)`; }
        if(it._imgs){ const k=it._imgs.length, seg=(it.cycleEnd||dur)/k; it._imgs.forEach((m,j)=>{ if(j===0)return; m.style.opacity=ramp(lt,seg*j-0.15,seg*j+0.25).toFixed(3); }); }
      } else if(it.kind==='logo'){
        itemAnim(it,lt,dur);
        const s=eback(ramp(lt,0.15,0.85)); it._logo.style.transform=`scale(${0.35+0.65*s}) rotate(${(1-s)*-25}deg)`; it._logo.style.opacity=ramp(lt,0.1,0.4);
        it._sweep.style.transform=`rotate(${lt*300}deg)`; it._sweep.style.opacity=(0.9*ramp(lt,0,0.4)).toFixed(3);
        it._rings.forEach((rg,j)=>{const q=eo(ramp(lt,0.05+j*0.12,0.75+j*0.12)); rg.style.transform=`scale(${0.4+0.6*q})`; rg.style.opacity=(q*(0.9-j*0.2)).toFixed(3)});
      } else itemAnim(it,lt,dur);
    }
  }
  // flash hits
  let fl=0; for(const h of (TL.flashes||[])){ const d=t-h; if(d>=0&&d<0.5) fl=Math.max(fl,(1-d/0.5)*0.55); }
  document.getElementById('flash').style.opacity=fl.toFixed(3);
  // captions
  if(TL.captions){
    const cap=document.getElementById('cap'); let g=null;
    for(const c of TL.captions){ if(t>=c.s && t<c.e+0.05){g=c;break} }
    if(!g){ if(cap._g!==-1){cap.innerHTML='';cap._g=-1} }
    else{
      const key=g.s+':'+g.words.findIndex(w=>t>=w.s&&t<w.e+0.12);
      if(cap._g!==key){ cap._g=key; cap.innerHTML=g.words.map(w=>`<span class="w${(t>=w.s&&t<w.e+0.12)?' on':''}">${w.w}</span>`).join(' '); }
      const a=eo(ramp(t,g.s,g.s+0.12)); cap.style.opacity=a; cap.style.transform=`translateY(${(1-a)*18}px)`;
    }
  }
  await Promise.all(waits);
  return true;
}

async function init(url){
  const tl=(typeof url==='string')?await (await fetch(url)).json():url; build(tl);
  await document.fonts.load('800 40px Urbanist'); await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  return {W:tl.W,H:tl.H,fps:tl.fps,duration:tl.duration};
}
window.seek=seek; window.init=init;
</script></body></html>
